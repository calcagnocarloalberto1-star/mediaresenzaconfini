name: Aggiorna conteggio articoli pubblicati

on:
  push:
    branches: [main]
    paths:
      - '20*/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcola numero di articoli pubblicati e aggiorna static/article-count.json
        run: python3 .github/scripts/update_article_count.py

      - name: Commit e push se cambiato
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/article-count.json
          git diff --cached --quiet || git commit -m "Aggiorna conteggio articoli pubblicati (automatico)"
          git push
