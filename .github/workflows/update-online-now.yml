name: Aggiorna visitatori online

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-online-now:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch online-now count from GoatCounter and update static/online-now.json
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 .github/scripts/update_online_now.py

      - name: Commit and push if changed
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/online-now.json
          git diff --cached --quiet || git commit -m "Aggiorna visitatori online (automatico)"
          git push
