name: Allinea il menu delle pagine tag e categoria

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggiunge la voce Storia legislazione al menu
        run: |
          python3 - <<'PYEOF'
          import os, json

          VECCHIO = '<a href="/legislazione-internazionale/">Legislazione internazionale</a>\n<a href="/paesi-ue-in-numeri/">Paesi UE in numeri</a>'
          NUOVO = ('<a href="/legislazione-internazionale/">Legislazione internazionale</a>\n'
                   '<a href="/storia-della-legislazione-per-paese/">Storia legislazione</a>\n'
                   '<a href="/paesi-ue-in-numeri/">Paesi UE in numeri</a>')

          SOLO_LEG = '<a href="/legislazione-internazionale/">Legislazione internazionale</a>'
          SOLO_LEG_NUOVO = ('<a href="/legislazione-internazionale/">Legislazione internazionale</a>\n'
                            '<a href="/storia-della-legislazione-per-paese/">Storia legislazione</a>\n'
                            '<a href="/paesi-ue-in-numeri/">Paesi UE in numeri</a>')

          modificate = 0
          saltate = []

          for radice in ("tag", "categoria"):
              for base, dirs, files in os.walk(radice):
                  for f in files:
                      if f != "index.html":
                          continue
                      p = os.path.join(base, f)
                      c = open(p, encoding="utf-8").read()
                      if "storia-della-legislazione-per-paese" in c:
                          continue
                      if c.count(VECCHIO) == 1:
                          nuovo = c.replace(VECCHIO, NUOVO, 1)
                      elif c.count(SOLO_LEG) == 1 and "paesi-ue-in-numeri" not in c:
                          # pagine categoria con il menu piu vecchio: mancano sia Storia sia Paesi UE
                          nuovo = c.replace(SOLO_LEG, SOLO_LEG_NUOVO, 1)
                      else:
                          saltate.append(p)
                          continue
                      # controlli: cambia solo il menu, nient'altro
                      if nuovo.count("<div") != c.count("<div") or nuovo.count("</div>") != c.count("</div>"):
                          saltate.append(p)
                          continue
                      if nuovo.count("<a ") - c.count("<a ") not in (1, 2):
                          saltate.append(p)
                          continue
                      open(p, "w", encoding="utf-8").write(nuovo)
                      modificate += 1

          print(json.dumps({"pagine_aggiornate": modificate, "saltate": saltate[:20], "n_saltate": len(saltate)}, ensure_ascii=False, indent=2))
          if saltate:
              raise SystemExit("alcune pagine non hanno la struttura attesa, verificare")
          PYEOF

      - name: Commit e push
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Allinea il menu di 930 pagine tag e categoria (aggiunge Storia legislazione)"
          git push
