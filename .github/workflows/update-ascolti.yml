name: Aggiorna classifica ascolti (Preferisci ascoltare?)

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ascolti:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch listen-event stats from GoatCounter and update static/ascolti.json
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 .github/scripts/update_ascolti.py

      - name: Commit and push if changed
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f static/ascolti.json ]; then
            echo "static/ascolti.json non è stato scritto in questa esecuzione (manca il secret GOATCOUNTER_API_TOKEN, oppure lo script non ha trovato ascolti): nessun commit da fare."
            exit 0
          fi
          git add static/ascolti.json
          git diff --cached --quiet || git commit -m "Aggiorna classifica ascolti (automatico)"
          git push
