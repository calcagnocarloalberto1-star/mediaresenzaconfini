name: Aggiungi la navigazione tra articoli (frecce avanti/indietro + home)

# Solo manuale: non deve mai partire da sola.
# Actions -> "Aggiungi la navigazione tra articoli (frecce avanti/indietro + home)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: 'Solo prova (genera senza fare commit/push)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  aggiungi-navigazione:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggiunge le frecce di navigazione a tutti gli articoli del blog
        run: python3 .github/scripts/aggiungi_navigazione_articoli/aggiungi-navigazione-articoli.py

      - name: Mostra un riepilogo delle modifiche
        run: |
          echo "### File modificati" >> $GITHUB_STEP_SUMMARY
          git status --porcelain | wc -l >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git status --porcelain >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit e push se cambiato
        if: ${{ inputs.solo_prova == false }}
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          git diff --cached --quiet || git commit -m "Aggiunge la navigazione (frecce avanti/indietro + home) a tutti gli articoli del blog"
          git push
