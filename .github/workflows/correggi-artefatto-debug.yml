name: Correggi artefatto di debug residuo

# Solo manuale: non deve mai partire da sola.
# Actions -> "Correggi artefatto di debug residuo" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: 'Solo prova (genera senza fare commit/push)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  correggi-artefatto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rimuove il testo di debug residuo dalle 5 pagine
        run: python3 .github/scripts/correggi_artefatto_debug/correggi-artefatto-debug.py .

      - name: Mostra un riepilogo delle modifiche
        run: |
          echo "### File modificati" >> $GITHUB_STEP_SUMMARY
          git status --porcelain | wc -l >> $GITHUB_STEP_SUMMARY
          git status --porcelain >> $GITHUB_STEP_SUMMARY
          git diff -- testi-in-vigore-francia/index.html testi-in-vigore-spagna/index.html testi-in-vigore-belgio/index.html testi-in-vigore-polonia/index.html testi-in-vigore-lussemburgo/index.html >> $GITHUB_STEP_SUMMARY

      - name: Commit e push se cambiato
        if: ${{ inputs.solo_prova == false }}
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- testi-in-vigore-francia/index.html testi-in-vigore-spagna/index.html testi-in-vigore-belgio/index.html testi-in-vigore-polonia/index.html testi-in-vigore-lussemburgo/index.html
          git diff --cached --quiet || git commit -m "Rimuove un artefatto di debug residuo (testo tecnico di sessione) da 5 pagine di testi-in-vigore"
          git push
