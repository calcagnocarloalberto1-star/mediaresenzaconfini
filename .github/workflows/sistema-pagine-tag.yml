name: Sistema pagine tag dai lotti

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sistema-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sposta le pagine dai lotti in tag/ e rimuovi i lotti
        run: |
          set -e
          shopt -s nullglob
          n=0
          for d in lotto-*/tag/*/; do
            slug=$(basename "$d")
            mkdir -p "tag/$slug"
            cp "$d/index.html" "tag/$slug/index.html"
            n=$((n+1))
          done
          echo "pagine spostate: $n"
          rm -rf lotto-*
          test "$n" -eq 777

      - name: Commit e push
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Modernizza template delle 777 pagine tag (priorita 4 audit: canonical, Open Graph, JSON-LD, menu hamburger, ricerca, GoatCounter) e rimuove le cartelle lotto-*"
          git push
