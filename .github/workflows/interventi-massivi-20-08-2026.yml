name: Interventi massivi 20-08-2026

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FIX_B64: 
  DEDUP_B64: 

jobs:
  interventi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Impronta di feed.xml prima
        run: sha256sum feed.xml | tee /tmp/feed_prima.txt

      - name: 1) Menu Storia legislazione e presidenza CNM
        run: |
          printf '%s' "$FIX_B64" | base64 -d > /tmp/fix_massivo.py
          python3 /tmp/fix_massivo.py .

      - name: 2) Deduplica Bangladesh e Spagna
        run: |
          printf '%s' "$DEDUP_B64" | base64 -d > /tmp/dedup.py
          python3 /tmp/dedup.py .

      - name: Verifica che feed.xml non sia stato toccato
        run: |
          sha256sum feed.xml | tee /tmp/feed_dopo.txt
          diff /tmp/feed_prima.txt /tmp/feed_dopo.txt
          if git status --porcelain | grep -E '(^| )feed\.xml'; then
            echo 'ERRORE: feed.xml risulta modificato'; exit 1
          fi

      - name: Riepilogo
        run: |
          echo "file modificati: $(git status --porcelain | wc -l)"
          git status --porcelain | head -30

      - name: Commit
        run: |
          git config user.name 'mediaresenzaconfini-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Menu Storia legislazione, presidenza CNM (Agostini), deduplica Bangladesh e Spagna'
          git push
