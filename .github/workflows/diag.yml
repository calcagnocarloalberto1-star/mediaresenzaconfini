name: DIAGNOSTICA temporanea API GoatCounter

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose GoatCounter API endpoints
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 .github/scripts/diag.py
