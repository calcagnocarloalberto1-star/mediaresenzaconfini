name: Completa il corpo di 2 articoli con contenuto mancante (bug "None")

# Solo manuale: non deve mai partire da sola.
# Actions -> "Completa il corpo di 2 articoli con contenuto mancante (bug "None")" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: 'Solo prova (genera senza fare commit/push)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  completa-corpo-articoli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Applica il completamento del corpo articolo
        run: python3 .github/scripts/completa_corpo_articoli/completa-corpo-articoli-27-08-2026.py .

      - name: Mostra un riepilogo delle modifiche
        run: |
          echo "### File modificati" >> $GITHUB_STEP_SUMMARY
          git status --porcelain | wc -l >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git status --porcelain >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit e push se cambiato
        if: ${{ inputs.solo_prova == false }}
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          git diff --cached --quiet || git commit -m "Completa il corpo di 2 articoli con contenuto mancante (bug 'None' da migrazione): TAR Abruzzo Pescara sez. I sentenza n. 98/2017 e CDM del 28/09/2022 sulla riforma della giustizia, con nota redazionale nuova basata su fonti pubbliche"
          git push
