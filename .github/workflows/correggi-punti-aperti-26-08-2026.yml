name: Risolve i punti aperti dell'audit generale del 26/08/2026

# Solo manuale: non deve mai partire da sola.
# Actions -> "Risolve i punti aperti dell'audit generale del 26/08/2026" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: 'Solo prova (genera senza fare commit/push)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  correggi-punti-aperti:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Applica le correzioni dei punti aperti
        run: python3 .github/scripts/correggi_punti_aperti/correggi-punti-aperti-26-08-2026.py .

      - name: Mostra un riepilogo delle modifiche
        run: |
          echo "### File modificati" >> $GITHUB_STEP_SUMMARY
          git status --porcelain | wc -l >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git status --porcelain >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit e push se cambiato
        if: ${{ inputs.solo_prova == false }}
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          git diff --cached --quiet || git commit -m "Risolve i 5 punti aperti (osservazioni minori) dell'audit generale del 26/08/2026: canonical mancanti, meta description mancanti, commenti WordPress residui, h1 multipli, immagine con sorgente esterna morta"
          git push
