name: Aggiungi il lettore vocale agli articoli

# Solo manuale.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: 'Solo prova (conta senza modificare nulla)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  aggiungi-lettore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install --quiet beautifulsoup4

      - name: Aggiungi il lettore
        run: |
          if [ "${{ inputs.solo_prova }}" = "true" ]; then
            python3 .github/scripts/aggiungi_lettore.py --prova
          else
            python3 .github/scripts/aggiungi_lettore.py
          fi

      - name: Riepilogo
        run: |
          echo "### Pagine toccate" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff --stat | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit e push se cambiato
        if: ${{ inputs.solo_prova == false }}
        run: |
          git config user.name "mediaresenzaconfini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "Accessibilita: lettore vocale su tutti gli articoli"
          git push
